name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/ci.db
    steps:
      - uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Prisma schema
        run: bunx prisma validate
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Lint
        run: bun run lint
      - name: Build production app
        run: bun run build
      - name: Test fail-closed production startup
        run: bash tests/start-prod-safety.sh
      - name: Compile Python render modules
        run: python -m compileall -q scripts/orbita3d
      - name: Validate shell syntax
        run: bash -n scripts/start-prod.sh
